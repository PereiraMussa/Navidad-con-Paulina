<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 900" width="700" height="900">
  <defs>
    <linearGradient id="pageBg3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF7" />
      <stop offset="100%" stop-color="#F5F0E8" />
    </linearGradient>
  </defs>

  <rect width="700" height="900" fill="url(#pageBg3)" />
  <rect x="25" y="25" width="650" height="850" fill="none" stroke="#D5CFC5" stroke-width="1" />

  <!-- Placeholder Badge Indicator -->
  <g transform="translate(350, 65)">
    <rect x="-140" y="-16" width="280" height="32" rx="4" fill="#5E0001" />
    <text x="0" y="5" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#FAF7F2">
      [PRÉVIA DA PÁGINA 3]
    </text>
  </g>

  <!-- Editorial Chapter Header -->
  <text x="50" y="140" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" letter-spacing="3" fill="#B58A45">
    CAPÍTULO IV · LA MESA MEMORABLE
  </text>
  <text x="50" y="180" font-family="'Fraunces', Georgia, serif" font-size="28" font-weight="900" fill="#1D2E19">
    Capas de Textura en la Mesa
  </text>
  <line x1="50" y1="205" x2="650" y2="205" stroke="#CFCABF" stroke-width="1.5" />

  <!-- Diagram Visual -->
  <g transform="translate(50, 230)">
    <!-- Diagram Table -->
    <rect x="0" y="0" width="600" height="230" rx="8" fill="#F4EFE6" stroke="#D5CFC5" stroke-width="1" />
    
    <!-- Table Runner (Textile) -->
    <rect x="40" y="60" width="520" height="110" rx="4" fill="#E8DEC8" />
    <line x1="40" y1="65" x2="560" y2="65" stroke="#B58A45" stroke-width="1" stroke-dasharray="4 4" />
    
    <!-- Centerpiece Pine Foliage -->
    <path d="M 120 115 Q 200 95 300 115 Q 400 95 480 115 Q 400 135 300 115 Q 200 135 120 115 Z" fill="#1D2E19" opacity="0.85" />
    <!-- Candle lights -->
    <circle cx="240" cy="115" r="7" fill="#DFBC76" />
    <circle cx="300" cy="115" r="9" fill="#EED59B" />
    <circle cx="360" cy="115" r="7" fill="#DFBC76" />
    <!-- Plate Settings -->
    <circle cx="80" cy="115" r="28" fill="#FFFFFF" stroke="#CFCABF" stroke-width="1.5" />
    <circle cx="80" cy="115" r="18" fill="#FAF7F2" stroke="#5E0001" stroke-width="1" />

    <circle cx="520" cy="115" r="28" fill="#FFFFFF" stroke="#CFCABF" stroke-width="1.5" />
    <circle cx="520" cy="115" r="18" fill="#FAF7F2" stroke="#5E0001" stroke-width="1" />

    <text x="300" y="38" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" fill="#76584C">
      DIAGRAMA DE ALTURAS PARA FACILITAR LA CONVERSACIÓN
    </text>
  </g>

  <!-- Detailed Guidelines list -->
  <g transform="translate(50, 490)">
    <rect x="0" y="0" width="600" height="270" rx="8" fill="#FFFFFF" stroke="#E5DEC9" stroke-width="1" />
    <text x="30" y="45" font-family="'Fraunces', Georgia, serif" font-size="18" font-weight="700" fill="#5E0001">
      Los 4 Elementos Fundamentales
    </text>
    
    <text x="30" y="85" font-family="'Manrope', sans-serif" font-size="13" font-weight="600" fill="#1D2E19">1. La Base Téxtil:</text>
    <text x="30" y="105" font-family="'Manrope', sans-serif" font-size="12" fill="#4A3D36">Lino lavado o algodón crudo que no requiera planchado rígido.</text>

    <text x="30" y="140" font-family="'Manrope', sans-serif" font-size="13" font-weight="600" fill="#1D2E19">2. La Altura del Centro:</text>
    <text x="30" y="160" font-family="'Manrope', sans-serif" font-size="12" fill="#4A3D36">Nunca superar los 25 cm para que los comensales puedan mirarse a los ojos.</text>

    <text x="30" y="195" font-family="'Manrope', sans-serif" font-size="13" font-weight="600" fill="#1D2E19">3. El Detalle Afectivo en la Servilleta:</text>
    <text x="30" y="215" font-family="'Manrope', sans-serif" font-size="12" fill="#4A3D36">Una ramita de romero fresco atada con un cordel fino de terciopelo.</text>

    <text x="30" y="248" font-family="'Manrope', sans-serif" font-size="11" font-style="italic" fill="#76584C">
      "La mejor vajilla es la que reúne a quienes más quieres."
    </text>
  </g>

  <!-- Editorial Page Footer -->
  <line x1="50" y1="820" x2="650" y2="820" stroke="#CFCABF" stroke-width="1" />
  <text x="50" y="845" font-family="'Manrope', sans-serif" font-size="11" fill="#76584C">
    La Navidad que Todos Recordarán · Paulina Celebra
  </text>
  <text x="650" y="845" text-anchor="end" font-family="'Manrope', sans-serif" font-size="11" font-weight="600" fill="#5E0001">
    Pág. 34
  </text>
</svg>
