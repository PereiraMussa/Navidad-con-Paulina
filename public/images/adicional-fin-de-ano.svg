<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500">
  <defs>
    <linearGradient id="upsellBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D2E19" />
      <stop offset="70%" stop-color="#142111" />
      <stop offset="100%" stop-color="#0B1309" />
    </linearGradient>
    <linearGradient id="upsellGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED59B" />
      <stop offset="50%" stop-color="#B58A45" />
      <stop offset="100%" stop-color="#805B22" />
    </linearGradient>
  </defs>

  <rect width="600" height="500" fill="url(#upsellBg)" />
  <rect x="20" y="20" width="560" height="460" fill="none" stroke="url(#upsellGold)" stroke-width="1.5" opacity="0.6" />

  <!-- Stars / Confetti Flourishes for New Year -->
  <g fill="url(#upsellGold)" opacity="0.8">
    <circle cx="120" cy="90" r="3" />
    <circle cx="480" cy="80" r="2.5" />
    <circle cx="160" cy="380" r="3" />
    <circle cx="440" cy="400" r="3.5" />
    <polygon points="300,75 304,87 316,88 307,96 310,108 300,101 290,108 293,96 284,88 296,87" />
  </g>

  <!-- Festive Champagne / New Year Symbolism -->
  <circle cx="300" cy="220" r="90" fill="#243820" stroke="url(#upsellGold)" stroke-width="2" />
  
  <text x="300" y="210" text-anchor="middle" font-family="'Fraunces', Georgia, serif" font-size="28" font-weight="700" fill="#FAF7F2">
    Año Nuevo
  </text>
  <text x="300" y="245" text-anchor="middle" font-family="'Parisienne', cursive" font-size="24" fill="#EED59B">
    Fin de Año &amp; Gratitud
  </text>

  <!-- Explicit Placeholder Tag Requested -->
  <g transform="translate(300, 360)">
    <rect x="-100" y="-18" width="200" height="36" rx="4" fill="#5E0001" stroke="url(#upsellGold)" stroke-width="1" />
    <text x="0" y="5" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#FAF7F2">
      [IMAGEM]
    </text>
  </g>

  <text x="300" y="430" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="12" fill="#CFCABF">
    Espacio reservado para producto adicional
  </text>
</svg>
