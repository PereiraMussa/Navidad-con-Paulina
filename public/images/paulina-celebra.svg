<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750">
  <defs>
    <linearGradient id="authorBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A0001" />
      <stop offset="50%" stop-color="#5E0001" />
      <stop offset="100%" stop-color="#1D2E19" />
    </linearGradient>
    <linearGradient id="authorGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED59B" />
      <stop offset="50%" stop-color="#B58A45" />
      <stop offset="100%" stop-color="#805B22" />
    </linearGradient>
  </defs>

  <!-- Elegant Dark Editorial Canvas -->
  <rect width="600" height="750" fill="url(#authorBg)" />
  <rect x="24" y="24" width="552" height="702" fill="none" stroke="url(#authorGold)" stroke-width="1.5" opacity="0.6" />

  <!-- Soft Portrait Silhouette Representation -->
  <circle cx="300" cy="270" r="130" fill="#2D0001" stroke="#8E6727" stroke-width="2" />
  <!-- Stylized Elegant Hair / Figure -->
  <path d="M 230 330 C 230 220 370 220 370 330 C 350 410 250 410 230 330 Z" fill="#4A342B" />
  <circle cx="300" cy="260" r="62" fill="#E6CEB8" />
  <path d="M 255 240 C 270 200 330 200 345 240 C 355 270 365 310 360 360 L 240 360 C 235 310 245 270 255 240 Z" fill="#36221A" opacity="0.9" />
  
  <!-- Warm Holiday Scarf in Deep Crimson -->
  <path d="M 220 360 C 260 340 340 340 380 360 C 410 430 430 520 440 600 L 160 600 C 170 520 190 430 220 360 Z" fill="#A60B08" stroke="#5E0001" stroke-width="2" />

  <!-- Warm Light Glow -->
  <circle cx="300" cy="260" r="145" fill="#FFEAA7" opacity="0.08" />

  <!-- Prominent Placement Label Requested -->
  <g transform="translate(300, 520)">
    <rect x="-170" y="-20" width="340" height="40" rx="6" fill="#1D2E19" stroke="url(#authorGold)" stroke-width="1.5" />
    <text x="0" y="6" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#FAF7F2">
      [FOTO_DE_PAULINA_CELEBRA]
    </text>
  </g>

  <text x="300" y="610" text-anchor="middle" font-family="'Fraunces', Georgia, serif" font-size="28" font-weight="700" fill="#FAF7F2">
    Paulina Celebra
  </text>
  <text x="300" y="645" text-anchor="middle" font-family="'Parisienne', cursive" font-size="22" fill="#DFBC76">
    Celebraciones con intención y amor
  </text>
</svg>
