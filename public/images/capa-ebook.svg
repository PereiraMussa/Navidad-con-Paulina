<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1150" width="800" height="1150">
  <defs>
    <!-- Background Gradient: Deep Wine into Christmas Crimson -->
    <radialGradient id="bgGradient" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#7A0002" />
      <stop offset="65%" stop-color="#5E0001" />
      <stop offset="100%" stop-color="#360001" />
    </radialGradient>

    <!-- Gold Accent Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFBC76" />
      <stop offset="50%" stop-color="#B58A45" />
      <stop offset="100%" stop-color="#8E6727" />
    </linearGradient>

    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EED59B" />
      <stop offset="50%" stop-color="#B58A45" />
      <stop offset="100%" stop-color="#7F5C24" />
    </linearGradient>

    <!-- Christmas Red Cord Gradient -->
    <linearGradient id="redCord" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7A0002" />
      <stop offset="30%" stop-color="#D9221D" />
      <stop offset="70%" stop-color="#A60B08" />
      <stop offset="100%" stop-color="#5E0001" />
    </linearGradient>

    <!-- Christmas Bauble Shading -->
    <radialGradient id="baubleShine" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FF6B68" />
      <stop offset="35%" stop-color="#A60B08" />
      <stop offset="85%" stop-color="#5E0001" />
      <stop offset="100%" stop-color="#2D0001" />
    </radialGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Canvas: Deep Wine Background -->
  <rect width="800" height="1150" fill="url(#bgGradient)" />

  <!-- Textured Subtle Paper Grain/Linen Overlay -->
  <rect width="800" height="1150" fill="#000000" opacity="0.05" />

  <!-- Outer Double Framing in Discrete Gold and Ivory -->
  <rect x="36" y="36" width="728" height="1078" fill="none" stroke="url(#goldBorder)" stroke-width="2" opacity="0.75" />
  <rect x="46" y="46" width="708" height="1058" fill="none" stroke="#CFCABF" stroke-width="1" stroke-opacity="0.35" />

  <!-- Elegant Corner Flourishes -->
  <path d="M 36 70 L 70 70 L 70 36" fill="none" stroke="url(#goldGradient)" stroke-width="2" />
  <path d="M 764 70 L 730 70 L 730 36" fill="none" stroke="url(#goldGradient)" stroke-width="2" />
  <path d="M 36 1080 L 70 1080 L 70 1114" fill="none" stroke="url(#goldGradient)" stroke-width="2" />
  <path d="M 764 1080 L 730 1080 L 730 1114" fill="none" stroke="url(#goldGradient)" stroke-width="2" />

  <!-- Author Name at Top -->
  <text x="400" y="110" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="16" font-weight="600" letter-spacing="6" fill="#CFCABF">
    PAULINA CELEBRA
  </text>
  <line x1="320" y1="125" x2="480" y2="125" stroke="url(#goldGradient)" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />

  <!-- Central Visual Motif: Pine Branch, Red Cord, Bow & Christmas Bauble -->
  <g transform="translate(400, 290)">
    <!-- Pine Sprigs (Forest Green: #1D2E19) -->
    <path d="M -90 -30 Q -40 -60 0 -20 Q 40 -60 90 -30 Q 30 10 0 -5 Q -30 10 -90 -30 Z" fill="#1D2E19" opacity="0.9" />
    <path d="M -120 10 Q -60 -25 -10 5 Q 40 -25 120 10 Q 50 35 0 15 Q -50 35 -120 10 Z" fill="#152412" opacity="0.95" />
    <!-- Pine Needles Detail -->
    <path d="M -60 -10 L -80 -40 M -40 -15 L -55 -48 M -20 -18 L -30 -52 M 0 -12 L 0 -55 M 20 -18 L 30 -52 M 40 -15 L 55 -48 M 60 -10 L 80 -40" stroke="#283E23" stroke-width="3" stroke-linecap="round" />

    <!-- Hanging Red Cord (Cordão Vermelho) -->
    <path d="M 0 -180 L 0 50" stroke="url(#redCord)" stroke-width="4.5" stroke-linecap="round" />
    <!-- Cord Twisted Texture -->
    <path d="M 0 -170 L 2 -165 M 0 -150 L 2 -145 M 0 -130 L 2 -125 M 0 -110 L 2 -105 M 0 -90 L 2 -85 M 0 -70 L 2 -65 M 0 -50 L 2 -45 M 0 -30 L 2 -25 M 0 -10 L 2 -5 M 0 10 L 2 15 M 0 30 L 2 35" stroke="#FFA29F" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

    <!-- Christmas Bauble (Bola Natalina) hanging from the cord -->
    <!-- Gold Cap of Bauble -->
    <rect x="-14" y="44" width="28" height="14" rx="3" fill="url(#goldGradient)" stroke="#8E6727" stroke-width="1" />
    <ellipse cx="0" cy="44" rx="9" ry="5" fill="none" stroke="url(#goldGradient)" stroke-width="2.5" />

    <!-- Spherical Red Bauble with Rich Deep Wine Shading -->
    <circle cx="0" cy="130" r="74" fill="url(#baubleShine)" />
    <!-- Gold Filigree Ring on Bauble -->
    <ellipse cx="0" cy="130" rx="74" ry="18" fill="none" stroke="url(#goldGradient)" stroke-width="2.5" opacity="0.75" />
    <!-- Festive Star Sparkle Reflection on Bauble -->
    <circle cx="-25" cy="105" r="14" fill="#FFFFFF" opacity="0.35" filter="url(#softGlow)" />
    <circle cx="-22" cy="102" r="5" fill="#FFFFFF" opacity="0.8" />

    <!-- Elegant Velvet Ribbon & Bow (Laço) -->
    <!-- Ribbon Loops -->
    <path d="M 0 50 C -35 25 -75 20 -70 52 C -65 80 -15 65 0 55 C 15 65 65 80 70 52 C 75 20 35 25 0 50 Z" fill="#A60B08" stroke="#7A0002" stroke-width="1.5" />
    <!-- Ribbon Loop Highlights -->
    <path d="M -20 45 C -45 35 -60 38 -55 52" fill="none" stroke="#FF8A88" stroke-width="2" stroke-linecap="round" opacity="0.7" />
    <path d="M 20 45 C 45 35 60 38 55 52" fill="none" stroke="#FF8A88" stroke-width="2" stroke-linecap="round" opacity="0.7" />
    <!-- Bow Knot -->
    <ellipse cx="0" cy="52" rx="14" ry="12" fill="#7A0002" stroke="url(#goldGradient)" stroke-width="1.5" />
    <!-- Ribbon Tails -->
    <path d="M -8 58 Q -28 100 -40 145 L -26 142 Q -16 105 -2 60 Z" fill="#A60B08" opacity="0.95" />
    <path d="M 8 58 Q 28 100 40 145 L 26 142 Q 16 105 2 60 Z" fill="#8C0705" opacity="0.95" />
  </g>

  <!-- Discrete Separator -->
  <line x1="280" y1="520" x2="520" y2="520" stroke="url(#goldGradient)" stroke-width="1.5" opacity="0.7" />
  <circle cx="400" cy="520" r="4" fill="url(#goldGradient)" />

  <!-- Main Title: "La Navidad que Todos Recordarán" -->
  <!-- Serif Editorial Fraunces / High Style -->
  <text x="400" y="605" text-anchor="middle" font-family="'Fraunces', Georgia, serif" font-size="52" font-weight="900" letter-spacing="-0.5" fill="#FAF7F2">
    La Navidad
  </text>
  <text x="400" y="668" text-anchor="middle" font-family="'Parisienne', cursive, serif" font-size="44" fill="url(#goldGradient)" font-weight="normal">
    que Todos
  </text>
  <text x="400" y="742" text-anchor="middle" font-family="'Fraunces', Georgia, serif" font-size="56" font-weight="900" letter-spacing="-0.5" fill="#FAF7F2">
    Recordarán
  </text>

  <!-- Subtitle -->
  <text x="400" y="815" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="19" font-weight="500" fill="#CFCABF" letter-spacing="0.2">
    Decoración, sabores y organización
  </text>
  <text x="400" y="845" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="19" font-weight="500" fill="#CFCABF" letter-spacing="0.2">
    para crear una celebración inolvidable
  </text>

  <!-- Bottom Crest & Edition Badge -->
  <g transform="translate(400, 960)">
    <rect x="-180" y="-22" width="360" height="44" rx="2" fill="#1D2E19" stroke="url(#goldGradient)" stroke-width="1.5" />
    <text x="0" y="6" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#FAF7F2">
      GUÍA PRÁCTICA ILUSTRADA
    </text>
  </g>

  <!-- Footer Tagline -->
  <text x="400" y="1055" text-anchor="middle" font-family="'Parisienne', cursive" font-size="24" fill="#CFCABF" opacity="0.9">
    Paulina Celebra
  </text>
</svg>
