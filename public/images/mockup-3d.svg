<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1000" width="900" height="1000">
  <defs>
    <!-- Floor Drop Shadow Gradients -->
    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1D2E19" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#1D2E19" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#1D2E19" stop-opacity="0" />
    </radialGradient>

    <!-- Hard Book Spine Gradient -->
    <linearGradient id="spineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#300001" />
      <stop offset="35%" stop-color="#5E0001" />
      <stop offset="85%" stop-color="#7A0002" />
      <stop offset="100%" stop-color="#3F0001" />
    </linearGradient>

    <!-- Pages Depth Texture -->
    <linearGradient id="pageStack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D9D5CC" />
      <stop offset="25%" stop-color="#EFECE4" />
      <stop offset="60%" stop-color="#D6D1C6" />
      <stop offset="90%" stop-color="#C2BCB0" />
      <stop offset="100%" stop-color="#A8A296" />
    </linearGradient>

    <!-- Cover Front Face Gradient -->
    <linearGradient id="coverFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#800204" />
      <stop offset="45%" stop-color="#5E0001" />
      <stop offset="100%" stop-color="#3A0001" />
    </linearGradient>

    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#EED59B" />
      <stop offset="40%" stop-color="#B58A45" />
      <stop offset="100%" stop-color="#805B22" />
    </linearGradient>

    <filter id="bookShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="-10" dy="25" stdDeviation="22" flood-color="#381D14" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Ambient Floor Shadow -->
  <ellipse cx="460" cy="850" rx="380" ry="60" fill="url(#floorShadow)" />
  <ellipse cx="430" cy="840" rx="260" ry="32" fill="#201108" opacity="0.35" />

  <!-- 3D Book Container Group with subtle tilt -->
  <g filter="url(#bookShadow)">
    
    <!-- Top Pages Edge (Isometric View) -->
    <polygon points="230,190 295,145 690,195 625,240" fill="url(#pageStack)" stroke="#B8B2A5" stroke-width="0.5" />

    <!-- Spine (Left Edge) -->
    <polygon points="160,240 230,190 230,780 160,830" fill="url(#spineGradient)" />

    <!-- Gold Stamping on Spine -->
    <g transform="translate(195, 510) rotate(-90)">
      <text x="0" y="0" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="14" font-weight="700" letter-spacing="4" fill="url(#goldSheen)">
        LA NAVIDAD QUE TODOS RECORDARÁN
      </text>
      <text x="0" y="16" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="11" font-weight="500" letter-spacing="2" fill="#CFCABF">
        PAULINA CELEBRA
      </text>
    </g>

    <!-- Spine Crease Shadow Line -->
    <line x1="230" y1="190" x2="230" y2="780" stroke="#250000" stroke-width="3" opacity="0.8" />
    <line x1="235" y1="193" x2="235" y2="783" stroke="#9E1417" stroke-width="1.5" opacity="0.6" />

    <!-- Front Cover Face -->
    <polygon points="230,190 690,240 690,830 230,780" fill="url(#coverFace)" />

    <!-- Front Cover Gloss/Lighting Overlay -->
    <polygon points="230,190 380,206 380,796 230,780" fill="#FFFFFF" opacity="0.06" />

    <!-- Front Cover Borders in Discrete Gold -->
    <polygon points="260,225 660,268 660,802 260,758" fill="none" stroke="url(#goldSheen)" stroke-width="2" opacity="0.8" />
    <polygon points="268,233 652,274 652,794 268,752" fill="none" stroke="#CFCABF" stroke-width="0.75" opacity="0.4" />

    <!-- Cover Elements Mapped to 3D Perspective -->
    <!-- Author Name -->
    <g transform="translate(460, 275) skewY(6.2)">
      <text x="0" y="0" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="14" font-weight="600" letter-spacing="5" fill="#CFCABF">
        PAULINA CELEBRA
      </text>
      <line x1="-70" y1="12" x2="70" y2="12" stroke="url(#goldSheen)" stroke-width="1.2" opacity="0.8" />
    </g>

    <!-- Christmas Pine, Cord, Bow and Bauble Motifs -->
    <g transform="translate(460, 390) skewY(6.2)">
      <!-- Pine Branches -->
      <path d="M -70 -20 Q 0 -45 70 -20 Q 20 5 -70 -20 Z" fill="#1D2E19" />
      <path d="M -90 10 Q 0 -15 90 10 Q 30 25 -90 10 Z" fill="#152412" />

      <!-- Hanging Red Cord -->
      <line x1="0" y1="-95" x2="0" y2="15" stroke="#D9221D" stroke-width="3.5" />

      <!-- Red & Deep Wine Bauble -->
      <circle cx="0" cy="80" r="52" fill="#800204" stroke="#5E0001" stroke-width="1.5" />
      <circle cx="-16" cy="65" r="8" fill="#FFFFFF" opacity="0.5" />
      <ellipse cx="0" cy="80" rx="52" ry="12" fill="none" stroke="url(#goldSheen)" stroke-width="2" opacity="0.8" />

      <!-- Golden Bauble Cap -->
      <rect x="-10" y="24" width="20" height="9" rx="2" fill="url(#goldSheen)" />

      <!-- Red Velvet Bow -->
      <path d="M 0 28 C -25 10 -55 8 -50 30 C -45 50 -10 40 0 32 C 10 40 45 50 50 30 C 55 8 25 10 0 28 Z" fill="#A60B08" stroke="#7A0002" stroke-width="1.2" />
      <ellipse cx="0" cy="30" rx="9" ry="8" fill="#5E0001" stroke="url(#goldSheen)" stroke-width="1" />
      <path d="M -6 34 L -22 85 L -12 83 L 0 36 Z" fill="#A60B08" />
      <path d="M 6 34 L 22 85 L 12 83 L 0 36 Z" fill="#8C0705" />
    </g>

    <!-- Cover Typography -->
    <g transform="translate(460, 560) skewY(6.2)">
      <line x1="-80" y1="-25" x2="80" y2="-25" stroke="url(#goldSheen)" stroke-width="1.2" opacity="0.7" />
      <text x="0" y="10" text-anchor="middle" font-family="'Fraunces', Georgia, serif" font-size="34" font-weight="900" fill="#FAF7F2">
        La Navidad
      </text>
      <text x="0" y="48" text-anchor="middle" font-family="'Parisienne', cursive" font-size="30" fill="url(#goldSheen)">
        que Todos
      </text>
      <text x="0" y="94" text-anchor="middle" font-family="'Fraunces', Georgia, serif" font-size="37" font-weight="900" fill="#FAF7F2">
        Recordarán
      </text>

      <!-- Subtitle -->
      <text x="0" y="132" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="12" font-weight="500" fill="#CFCABF">
        Decoración, sabores y organización
      </text>
      <text x="0" y="150" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="12" font-weight="500" fill="#CFCABF">
        para crear una celebración inolvidable
      </text>

      <!-- Badge -->
      <rect x="-110" y="180" width="220" height="28" rx="2" fill="#1D2E19" stroke="url(#goldSheen)" stroke-width="1.2" />
      <text x="0" y="198" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="9" font-weight="700" letter-spacing="2" fill="#FAF7F2">
        GUÍA PRÁCTICA ILUSTRADA
      </text>
    </g>

    <!-- Side Pages Edge (Thickness on Right Side) -->
    <polygon points="690,240 735,200 735,790 690,830" fill="url(#pageStack)" stroke="#AFAAA0" stroke-width="0.5" />
    <!-- Fine Page Line Indentations -->
    <line x1="700" y1="230" x2="700" y2="820" stroke="#8E887E" stroke-width="0.5" opacity="0.4" />
    <line x1="712" y1="220" x2="712" y2="810" stroke="#8E887E" stroke-width="0.5" opacity="0.4" />
    <line x1="724" y1="210" x2="724" y2="800" stroke="#8E887E" stroke-width="0.5" opacity="0.4" />

    <!-- Satin Bookmark Ribbon Hanging from Bottom -->
    <path d="M 520 812 Q 530 870 545 910 L 530 905 L 515 910 Q 510 870 505 810 Z" fill="#A60B08" stroke="#7A0002" stroke-width="0.75" />
  </g>
</svg>
